# Publica o catálogo digital no GitHub Pages a cada push na main.
# Gera as fichas e os dados do site a partir da planilha; nada gerado precisa ser commitado.
# As fichas (a etapa mais lenta) ficam em cache e só são refeitas quando algo que as afeta muda:
# planilha, gerador de fichas, núcleo mdtech/, assets/ (fotos, logos, fontes, ícones) ou requirements.
# Mudou só HTML/CSS/JS do site? As fichas vêm do cache e a publicação leva cerca de 1 minuto.
# Os catálogos DIGITAIS em PDF (foto reduzida: ~6 MB no total, ~25 s) são gerados aqui e vão junto com o site.
# Os catálogos IMPRESSOS (foto original, alta resolução) são só locais e nunca passam por este workflow.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refazer_fichas:
        description: "Ignorar o cache e gerar as fichas de novo"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências do sistema (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Dependências Python
        run: pip install -r requirements.txt

      - name: Cache das fichas
        id: cache-fichas
        uses: actions/cache@v4
        with:
          path: saida
          # run_id na chave = nunca reaproveita (usado quando refazer_fichas está marcado)
          key: fichas-${{ inputs.refazer_fichas && github.run_id || 'v1' }}-${{ hashFiles('dados/Base_MDTech_Consolidada.xlsx', 'geradores/fichas.py', 'gerar.py', 'mdtech/*.py', 'assets/**', 'requirements.txt') }}

      - name: Fichas técnicas (1 PDF por código)
        if: steps.cache-fichas.outputs.cache-hit != 'true'
        run: python gerar.py fichas --separados

      - name: Catálogos digitais (PDF, foto reduzida)
        run: python gerar.py catalogo --todos --perfil digital

      - name: Dados do site (produtos.json, fotos, fichas, catálogos)
        run: python gerar.py site

      - name: Conferir resultado
        run: |
          test -s site/produtos.json
          test -n "$(ls site/fotos)"
          test -n "$(ls site/fichas)"
          test -s site/catalogos/Catalogo_Completo_MDTech.pdf
          test "$(ls site/catalogos | wc -l)" -ge 5
          python -c "import json; d=json.load(open('site/meta.json',encoding='utf-8')); print(d); assert d['total']>0 and d['com_foto']>0"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
