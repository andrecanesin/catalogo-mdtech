<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo MDTech — Instrumentais e óticas cirúrgicas</title>
  <meta name="description" content="Catálogo de instrumentais cirúrgicos e óticas HD-4K MDTech: laparoscopia, urologia, histeroscopia. Busque por código ou nome e peça orçamento.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="MDTech — início">
        <img class="logo" src="img/logo.png" alt="MDTech"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span class="brand-txt">MD<b>Tech</b><small>Tecnologia que abre caminhos</small></span>
      </a>
      <div class="busca">
        <input id="busca" type="search" placeholder="Buscar por código ou nome (ex.: maryland, trocarter, A153)" aria-label="Buscar produtos">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="layout">
      <aside class="side" id="filtros" aria-label="Filtros"></aside>
      <section>
        <div class="barra">
          <button class="btn-filtrar" id="btn-filtrar" aria-label="Abrir filtros">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" width="16" height="16"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
            Filtrar<span id="fnum"></span>
          </button>
          <div class="cont" id="cont"></div>
          <div class="chips" id="chips"></div>
        </div>
        <div class="grade" id="grade"></div>
      </section>
    </div>
  </main>

  <div class="backdrop" id="backdrop"></div>

  <div class="bandeja" id="bandeja" aria-live="polite">
    <div class="wrap">
      <span class="qt" id="qt"></span>
      <span class="cresc">Monte sua lista e peça o orçamento — sem compromisso.</span>
      <button class="bt-ver" id="bt-limpar">Limpar lista</button>
      <button class="bt-mail" id="bt-mail">Pedir por e-mail</button>
      <button class="bt-wpp" id="bt-wpp">Pedir no WhatsApp</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
