<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vendedores · MDTech</title>
  <meta name="robots" content="noindex">
  <link rel="preload" href="fonts/Poppins-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Poppins-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/estilo.css">
  <meta name="theme-color" content="#193C6C">
  <link rel="icon" type="image/png" sizes="32x32" href="img/app/favicon-32.png">
  <link rel="apple-touch-icon" href="img/app/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MDTech">
</head>
<body class="pg-conta">
  <header class="top">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="MDTech — voltar ao catálogo">
        <img class="logo" src="img/logo.png" alt="MDTech"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span class="brand-txt">MD<b>Tech</b><small>Tecnologia que abre caminhos</small></span>
      </a>
    </div>
  </header>

  <main class="adm-wrap">
    <a class="conta-voltar" href="index.html">← Voltar ao catálogo</a>
    <h1>Vendedores</h1>
    <p class="conta-sub" id="adm-sub">Cadastre vendedores, envie o convite por WhatsApp ou e-mail e desative quem saiu.</p>
    <div class="conta-msg" id="adm-msg" role="alert" hidden></div>

    <div id="adm-conteudo" hidden>
      <!-- convite gerado: link de uso único (7 dias) para o vendedor criar a senha -->
      <section class="adm-senha" id="painel-senha" hidden aria-labelledby="senha-titulo" tabindex="-1">
        <h2 id="senha-titulo">Convite pronto</h2>
        <p class="adm-senha-para" id="senha-para"></p>
        <p class="conta-dica" id="senha-valor"></p>
        <div class="adm-senha-acoes">
          <a class="conta-bt" id="env-wpp" target="_blank" rel="noopener">Enviar no WhatsApp</a>
          <a class="conta-bt sec" id="env-mail">Enviar por e-mail</a>
          <button type="button" class="conta-bt sec" id="env-copiar">Copiar mensagem</button>
          <button type="button" class="conta-bt sec" id="env-fechar">Fechar</button>
        </div>
      </section>

      <section class="adm-caixa" aria-labelledby="add-titulo">
        <h2 id="add-titulo">Adicionar vendedor</h2>
        <form id="f-add" class="conta-form adm-add" novalidate>
          <div>
            <label for="add-email">E-mail</label>
            <input id="add-email" type="email" inputmode="email" autocapitalize="off" spellcheck="false" autocomplete="off" required>
          </div>
          <div>
            <label for="add-nome">Nome <span class="opc">(opcional)</span></label>
            <input id="add-nome" type="text" autocomplete="off">
          </div>
          <button type="submit" class="conta-bt">Adicionar e criar convite</button>
        </form>
      </section>

      <section aria-labelledby="lista-titulo">
        <h2 id="lista-titulo" class="adm-h2">Cadastrados <span id="lista-total"></span></h2>
        <ul class="adm-lista" id="lista"></ul>
      </section>

      <details class="adm-caixa adm-hist" id="hist">
        <summary>Histórico</summary>
        <ul id="hist-lista"></ul>
      </details>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/vendedores.js"></script>
</body>
</html>
