<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produto — Catálogo MDTech</title>
  <meta name="description" content="Ficha do produto no catálogo MDTech: especificações, registro ANVISA, NCM e pedido de orçamento.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="MDTech — início">
        <img class="logo" src="img/logo.png" alt="MDTech"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span class="brand-txt">MD<b>Tech</b><small>Tecnologia que abre caminhos</small></span>
      </a>
      <form class="busca" action="index.html" method="get" role="search">
        <input id="busca" name="q" type="search" placeholder="Buscar por código ou nome (ex.: maryland, trocarter, A153)" aria-label="Buscar produtos">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </form>
      <button class="btn-catalogos" id="btn-catalogos" aria-haspopup="true" aria-expanded="false" aria-label="Catálogos e propostas em PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" width="16" height="16"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
        <span class="l-longo">Catálogos e propostas</span><span class="l-curto">PDFs</span>
      </button>
    </div>
  </header>

  <div class="menu-catalogos" id="menu-catalogos" role="menu"></div>
  <div class="backdrop" id="backdrop-catalogos"></div>

  <main class="wrap" id="alvo"></main>

  <div class="rodape">MDTech · Tecnologia que abre caminhos</div>

  <div class="bandeja" id="bandeja" aria-live="polite">
    <div class="wrap">
      <span class="qt" id="qt"></span>
      <span class="cresc">Monte sua lista e peça um orçamento — sem compromisso.</span>
      <button class="bt-lista" id="bt-lista">Ver lista</button>
      <button class="bt-ver" id="bt-limpar">Limpar lista</button>
      <button class="bt-mail" id="bt-mail">Pedir por e-mail</button>
      <button class="bt-wpp" id="bt-wpp">Pedir no WhatsApp</button>
    </div>
  </div>

  <!-- lightbox de zoom da foto -->
  <div class="zoom-bg" id="zoom-bg" aria-hidden="true">
    <button class="zoom-x" id="zoom-x" aria-label="Fechar zoom">×</button>
    <img id="zoom-img" alt="">
  </div>

  <script src="js/config.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/produto.js"></script>
  <script src="js/suporte.js"></script>
</body>
</html>
